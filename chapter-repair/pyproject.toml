[project]
name = "chapter-repair"
version = "0.1.0"
description = "Find and replace a hallucinated chunk in a published chapter, then re-time everything after it"
readme = "README.md"
authors = [
    { name = "hermanismail", email = "hermanismail@gmail.com" }
]
requires-python = ">=3.12"
# No torch and no whisper: the TTS runs in the Irodori-TTS venv through the
# audition tool's worker, and transcription shells out to the existing
# C:\Transcribe venv. mutagen is here because a repaired .m4a has to carry
# its old title, artist, album and cover across the re-encode.
dependencies = [
    "customtkinter>=6.0.0",
    "pillow>=12.3.0",
    "mutagen>=1.47.0",
]

[tool.uv]
package = false
