[project]
name = "book-profiler"
version = "0.1.0"
description = "Measure how a seiyuu copes with a book's sentences and derive a dynamic parameter recipe"
readme = "README.md"
authors = [
    { name = "hermanismail", email = "hermanismail@gmail.com" }
]
requires-python = ">=3.12"
# Stages 1-4 are stdlib only; customtkinter is for the listening test's
# Results window, reused from seiyuu-audition. No torch, no irodori_tts: the
# TTS runs in the Irodori-TTS venv through the generator's irodori_batch.py,
# exactly as seiyuu-audition and chapter-repair reach it.
dependencies = [
    "customtkinter>=6.0.0",
    "pillow>=12.3.0",
]

[tool.uv]
package = false
