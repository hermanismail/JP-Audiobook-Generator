[project]
name = "dynamic-repair"
version = "0.1.0"
description = "Repair a part of a dynamic-profile chapter, with an editable reading for the TTS"
readme = "README.md"
authors = [
    { name = "hermanismail", email = "hermanismail@gmail.com" }
]
requires-python = ">=3.12"
# No torch and no whisper: the TTS runs in the Irodori-TTS venv through the
# generator's irodori_batch.py, and transcription shells out to the
# C:\Transcribe venv. mutagen carries the chapter's tags across the
# re-encode (chapter-repair's copy_tags).
dependencies = [
    "customtkinter>=6.0.0",
    "pillow>=12.3.0",
    "mutagen>=1.47.0",
]

[tool.uv]
package = false
