[project]
name = "scene-illustrator"
version = "0.1.0"
description = "Zen-mode images per chapter: read the book, curate a cast, draw and time scenes"
readme = "DESIGN.md"
authors = [
    { name = "hermanismail", email = "hermanismail@gmail.com" }
]
requires-python = ">=3.12"
# No torch and no model code: the LLM runs in llama.cpp's llama-server and
# the images in the separate ComfyUI install at F:\ComfyUI, both driven over
# HTTP. illustrator.py itself is stdlib-only.
dependencies = [
    "customtkinter>=6.0.0",
    "pillow>=12.3.0",
    "websocket-client>=1.9.2",
]

[tool.uv]
package = false
